<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top left, rgba(168,85,247,0.35), transparent 30%),
    radial-gradient(circle at bottom right, rgba(59,130,246,0.25), transparent 30%),
    linear-gradient(135deg,#070b16,#0b1020,#111827);

    font-family:"Segoe UI",sans-serif;
    color:white;
}

/* 背景の光 */
.glow1{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:#9333ea;
    left:-180px;
    bottom:-180px;
    filter:blur(140px);
    opacity:0.4;
}

.glow2{
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    background:#2563eb;
    right:-120px;
    top:-120px;
    filter:blur(140px);
    opacity:0.3;
}

.container{
    position:relative;
    text-align:center;
    z-index:2;
    animation:fade 2.5s ease;
    padding:50px;
}

/* 小タイトル */
.small{
    color:#c084fc;
    letter-spacing:6px;
    font-size:16px;
    margin-bottom:25px;
    opacity:0.9;
}

/* メインタイトル */
h1{
    font-size:88px;
    line-height:1.15;
    margin-bottom:35px;
    font-weight:700;
    text-shadow:0 0 30px rgba(255,255,255,0.08);
}

.highlight{
    color:#c084fc;
}

/* 本文 */
.message{
    font-size:22px;
    color:#d1d5db;
    line-height:2.3;
    font-weight:300;
    animation:fadeText 3.5s ease;
}

/* 下のライン */
.line{
    width:120px;
    height:4px;
    margin:45px auto;
    border-radius:999px;
    background:linear-gradient(to right,#9333ea,#3b82f6);
}

/* チーム名 */
.team{
    margin-top:25px;
    font-size:18px;
    letter-spacing:5px;
    color:#9ca3af;
}

/* ゆっくり浮かぶ */
.container{
    animation:float 5s ease-in-out infinite;
}

/* フェード */
@keyframes fade{
    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeText{
    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}

/* 浮遊感 */
@keyframes float{
    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }
}

</style>
</head>

<body>

<div class="glow1"></div>
<div class="glow2"></div>

<div class="container">

<div class="small">
TEAM B PRESENTATION
</div>

<h1>
Thank you for your<br>
<span class="highlight">attention.</span>
</h1>

<div class="line"></div>

<div class="message">

チーム開発を共に進めた<br>
TEAM B のメンバーのみんな、<br><br>

ご指導いただいた長谷川さん、<br>
そして発表を聞いてくださった皆様へ。<br><br>

この研修を通して、<br>
技術だけでなく、<br>
「協力して作り上げること」の大切さを学ぶことができました。<br><br>

本当にありがとうございました。

</div>

<div class="team">
TEAM B SALE_SYSTEM
</div>

</div>

</body>
</html>
```
