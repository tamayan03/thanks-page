<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    overflow:hidden;
}

body{

    overflow:hidden;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at top left, rgba(168,85,247,0.18), transparent 30%),
    radial-gradient(circle at bottom right, rgba(59,130,246,0.15), transparent 30%),
    linear-gradient(145deg,#050816,#0b1020,#111827);

    font-family:"Segoe UI",sans-serif;

    color:white;
}

/* 背景ぼかし */

.blur1{
    position:absolute;
    width:300px;
    height:300px;
    background:#9333ea;
    border-radius:50%;
    left:0;
    bottom:0;
    filter:blur(120px);
    opacity:0.2;
}

.blur2{
    position:absolute;
    width:250px;
    height:250px;
    background:#2563eb;
    border-radius:50%;
    right:0;
    top:0;
    filter:blur(120px);
    opacity:0.15;
}

/* メインカード */

.container{

    width:90%;
    max-width:900px;

    padding:70px 50px;

    border-radius:40px;

    background:rgba(255,255,255,0.04);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    box-shadow:
    0 0 60px rgba(0,0,0,0.4);

    text-align:center;

    position:relative;

    z-index:2;
}

/* 上 */

.small{

    color:#c084fc;

    letter-spacing:8px;

    font-size:13px;

    margin-bottom:25px;

    opacity:0;

    animation:fade 1.5s ease forwards;
}

/* タイトル */

h1{

    font-size:82px;

    line-height:1.1;

    margin-bottom:35px;

    font-weight:700;

    opacity:0;

    transform:translateY(20px);

    animation:title 1.8s ease forwards;

    animation-delay:0.8s;
}

.highlight{

    color:#d8b4fe;

    text-shadow:
    0 0 20px rgba(192,132,252,0.35);
}

/* ライン */

.line{

    width:120px;

    height:4px;

    margin:35px auto;

    border-radius:999px;

    background:
    linear-gradient(to right,#9333ea,#3b82f6,#ec4899);

    opacity:0;

    animation:fade 1.5s ease forwards;

    animation-delay:1.8s;
}

/* 本文 */

.message{

    font-size:20px;

    color:#d1d5db;

    line-height:2.2;

    font-weight:300;

    opacity:0;

    animation:fade 2s ease forwards;

    animation-delay:2.5s;
}

/* TEAM */

.team{

    margin-top:45px;

    color:#9ca3af;

    letter-spacing:6px;

    font-size:14px;

    opacity:0;

    animation:fade 2s ease forwards;

    animation-delay:3.3s;
}

/* フェード */

@keyframes fade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

/* タイトル登場 */

@keyframes title{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* スマホ */

@media(max-width:768px){

    .container{
        padding:45px 22px;
        border-radius:28px;
    }

    h1{
        font-size:42px;
    }

    .message{
        font-size:15px;
        line-height:2;
    }

    .small{
        font-size:10px;
        letter-spacing:5px;
    }

    .team{
        font-size:11px;
        letter-spacing:4px;
    }

    .line{
        width:80px;
    }

}

</style>
</head>

<body>

<div class="blur1"></div>
<div class="blur2"></div>

<div class="container">

<div class="small">
TEAM B PRESENTATION
</div>

<h1>
Thank you for your<br>
<span class="highlight">attention.</span>
</h1>

<div class="line"></div>

<div class="message">

TEAM B のメンバーのみんな、<br>
ご指導いただいた長谷川さん、<br>
そして発表を聞いてくださった皆様へ。<br><br>

本当にありがとうございました。

</div>

<div class="team">
TEAM B SALE_SYSTEM
</div>

</div>

</body>
</html>
