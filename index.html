<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top left,#6d28d9 0%,transparent 30%),
    radial-gradient(circle at bottom right,#2563eb 0%,transparent 30%),
    #0b1020;

    font-family:"Segoe UI",sans-serif;
    color:white;
}

.container{
    text-align:center;
    animation:fade 2s ease;
}

.small{
    color:#b14bff;
    letter-spacing:4px;
    font-size:18px;
    margin-bottom:20px;
}

h1{
    font-size:72px;
    font-weight:700;
    margin-bottom:25px;
    line-height:1.2;
}

.highlight{
    color:#b14bff;
}

.message{
    font-size:20px;
    color:#d1d5db;
    line-height:2;
    margin-top:30px;
}

.team{
    margin-top:50px;
    font-size:18px;
    letter-spacing:3px;
    color:#9ca3af;
}

.card{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(177,75,255,0.15);
    left:-150px;
    bottom:-180px;
    filter:blur(10px);
}

.card2{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(37,99,235,0.15);
    right:-80px;
    top:-80px;
    filter:blur(10px);
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="card"></div>
<div class="card2"></div>

<div class="container">

<div class="small">
TEAM B PRESENTATION
</div>

<h1>
Thank you for your<br>
<span class="highlight">attention!</span>
</h1>

<div class="message">

チーム開発を共に進めた<br>
TEAM B のメンバーのみんな、<br><br>

研修をご指導いただいた長谷川さん、<br>
そして発表を聞いてくださった皆様、<br><br>

本当にありがとうございました。

</div>

<div class="team">
TEAM B SALE_SYSTEM
</div>

</div>

</body>
</html>
