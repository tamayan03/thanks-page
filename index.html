<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    padding:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at 20% 20%, rgba(168,85,247,0.18), transparent 25%),
    radial-gradient(circle at 80% 30%, rgba(59,130,246,0.15), transparent 25%),
    radial-gradient(circle at 50% 100%, rgba(236,72,153,0.12), transparent 35%),
    linear-gradient(145deg,#050816,#0b1020,#111827);

    font-family:"Segoe UI",sans-serif;

    color:white;
}

/* 花火 */

#fireworks{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
}

/* 背景ぼかし */

.blur1{
    position:absolute;
    width:500px;
    height:500px;
    background:#9333ea;
    border-radius:50%;
    left:-180px;
    bottom:-180px;
    filter:blur(140px);
    opacity:0.35;
}

.blur2{
    position:absolute;
    width:400px;
    height:400px;
    background:#2563eb;
    border-radius:50%;
    right:-100px;
    top:-100px;
    filter:blur(140px);
    opacity:0.3;
}

/* メインカード */

.container{

    width:90%;
    max-width:1000px;

    padding:80px 60px;

    border-radius:40px;

    background:rgba(255,255,255,0.04);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    box-shadow:
    0 0 80px rgba(0,0,0,0.45);

    text-align:center;

    position:relative;

    z-index:2;

    animation:fade 2s ease;
}

/* 上の文字 */

.small{

    color:#c084fc;

    letter-spacing:8px;

    font-size:14px;

    margin-bottom:25px;

    opacity:0.9;
}

/* タイトル */

h1{

    font-size:92px;

    line-height:1.1;

    margin-bottom:35px;

    font-weight:700;

    letter-spacing:2px;

    word-break:keep-all;
}

.highlight{

    color:#d8b4fe;

    text-shadow:
    0 0 20px rgba(192,132,252,0.45);
}

/* ライン */

.line{

    width:140px;

    height:4px;

    margin:40px auto;

    border-radius:999px;

    background:
    linear-gradient(to right,#9333ea,#3b82f6,#ec4899);
}

/* 本文 */

.message{

    font-size:22px;

    color:#d1d5db;

    line-height:2.3;

    font-weight:300;

    margin-top:20px;
}

/* TEAM */

.team{

    margin-top:50px;

    color:#9ca3af;

    letter-spacing:6px;

    font-size:15px;
}

/* フェード */

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* スマホ対応 */

@media(max-width:768px){

    .container{
        padding:50px 25px;
        border-radius:28px;
    }

    h1{
        font-size:46px;
    }

    .message{
        font-size:16px;
        line-height:2.1;
    }

    .small{
        font-size:11px;
        letter-spacing:5px;
    }

    .team{
        font-size:12px;
        letter-spacing:4px;
    }

    .line{
        width:90px;
    }

}

/* 花火canvas */

canvas{
    position:fixed;
    top:0;
    left:0;
}

</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="blur1"></div>
<div class="blur2"></div>

<div class="container">

<div class="small">
TEAM B PRESENTATION
</div>

<h1>
Thank you for your<br>
<span class="highlight">attention.</span>
</h1>

<div class="line"></div>

<div class="message">

TEAM B のメンバーのみんな、<br>
ご指導いただいた長谷川さん、<br>
そして発表を聞いてくださった皆様へ。<br><br>

チーム開発を通して、<br>
協力して作り上げる大切さを学ぶことができました。<br><br>

本当にありがとうございました。

</div>

<div class="team">
TEAM B SALE_SYSTEM
</div>

</div>

<script>

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

});

class Firework{

    constructor(x,y,color){

        this.x = x;
        this.y = y;
        this.color = color;

        this.particles = [];

        /* 軽量化 */

        for(let i=0;i<40;i++){

            this.particles.push({

                x:this.x,
                y:this.y,

                angle:Math.random()*Math.PI*2,

                speed:Math.random()*5+2,

                radius:Math.random()*2+1,

                alpha:1

            });

        }

    }

    update(){

        this.particles.forEach(p=>{

            p.x += Math.cos(p.angle)*p.speed;
            p.y += Math.sin(p.angle)*p.speed;

            p.alpha -= 0.015;

        });

    }

    draw(){

        this.particles.forEach(p=>{

            ctx.beginPath();

            ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);

            ctx.fillStyle = `rgba(${this.color},${p.alpha})`;

            ctx.fill();

        });

    }

}

const fireworks = [];

function createFirework(){

    const x = Math.random()*canvas.width;
    const y = Math.random()*canvas.height*0.6;

    const colors = [
        "168,85,247",
        "59,130,246",
        "236,72,153",
        "255,255,255"
    ];

    fireworks.push(
        new Firework(
            x,
            y,
            colors[Math.floor(Math.random()*colors.length)]
        )
    );

}

/* 発射頻度調整 */

setInterval(createFirework,1800);

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    fireworks.forEach((f,index)=>{

        f.update();
        f.draw();

        if(f.particles[0].alpha <= 0){

            fireworks.splice(index,1);

        }

    });

    requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
